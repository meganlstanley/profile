<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Merchandise Gallery | Megan Stanley Botanical Studio</title>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Allura&family=Montserrat:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap"
        rel="stylesheet">

    <!-- Your existing website stylesheet -->
    <link rel="stylesheet" href="style.css">

    <!-- Gallery-specific styling -->
    <style>
        .merch-gallery-page {
            margin: 0;
            background: #F8F7ED;
            color: #2E2E2E;
            font-family: 'Montserrat', sans-serif;
        }

        .gallery-header {
            padding: 2rem 6%;
        }

        .gallery-back {
            color: #1F4D3A;
            font-weight: 600;
            text-decoration: none;
        }

        .gallery-back:hover {
            text-decoration: underline;
        }

        .gallery-intro {
            max-width: 760px;
            margin: 0 auto;
            padding: 3rem 6%;
            text-align: center;
        }

        .gallery-eyebrow {
            color: #6B8F71;
            font-size: 0.8rem;
            font-weight: 700;
            letter-spacing: 0.15em;
            text-transform: uppercase;
        }

        .gallery-intro h1 {
            color: #1F4D3A;
            font-family: 'Playfair Display', serif;
            font-size: clamp(2.5rem, 6vw, 4rem);
            margin: 1rem 0;
        }

        .gallery-intro p {
            line-height: 1.8;
            color: #555;
        }

        .gallery-section {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem 6% 4rem;
        }

        .gallery-section h2 {
            color: #1F4D3A;
            font-family: 'Playfair Display', serif;
            font-size: 2rem;
            margin-bottom: 1.5rem;
            padding-bottom: 0.75rem;
            border-bottom: 1px solid #A7C4A0;
        }

        /* Photo grid */
        .merch-photo-grid {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 1.2rem;
        }

        .merch-photo-card {
            margin: 0;
            overflow: hidden;
            border-radius: 10px;
            background: white;
        }



        .merch-photo-link img {
            display: block;
            width: 100%;
            aspect-ratio: 4 / 3;
            object-fit: contain;
            background-color: #F8F7ED;
            transition: transform 0.25s ease;
        }

        .merch-photo-link:hover img,
        .merch-photo-link:focus-visible img {
            transform: scale(1.04);
        }

        .merch-photo-link:focus-visible {
            outline: 3px solid #D6B055;
            outline-offset: -3px;
        }

        .gallery-footer {
            padding: 2.5rem 6%;
            background: #1F4D3A;
            text-align: center;
        }

        .gallery-footer a {
            color: #F8F7ED;
            font-weight: 600;
            text-decoration: none;
        }

        .gallery-footer a:hover {
            text-decoration: underline;
        }

        /* Tablet */
        @media (max-width: 800px) {
            .merch-photo-grid {
                grid-template-columns: repeat(2, minmax(0, 1fr));
            }
        }

        /* Mobile */
        @media (max-width: 520px) {
            .merch-photo-grid {
                grid-template-columns: 1fr;
            }

            .gallery-section h2 {
                font-size: 1.6rem;
            }
        }
    </style>
</head>
